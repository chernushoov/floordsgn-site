one_liner:
  ru: "Гладкий бесшовный эпоксидный пол для лёгких и средних промышленных нагрузок. Заливается до уровня сам, выравнивает мелкие неровности основания."
  en: "Smooth, seamless epoxy floor for light-to-medium industrial loads. Self-levels to a flat surface, hides minor substrate irregularities."

# ═════════ §1 — что это ═════════
what_is_it:
  ru: |
    Двухкомпонентная эпоксидная система на базе бисфенол-A смолы и аминного отвердителя, с кварцевым наполнителем для тиксотропии и износа. Заливается на подготовленное бетонное основание поверх грунтовки слоем 3–5 мм; жидкая консистенция позволяет смеси растекаться под собственным весом до горизонтальной плоскости. После полимеризации даёт бесшовное покрытие с гладкой полу-глянцевой поверхностью, средней химической стойкостью и заявленной адгезией к бетону свыше 1.5 МПа.

    Базовая система состоит из трёх слоёв: 2-компонентный праймер (~250 г/м²), наливная масса 3–5 мм, опционально топкоат (UV/износ). Без топкоата срок службы режется на 30–40% при высокой проходимости.

    Это рабочая лошадка промышленных полов: warehouse, retail, паркинг 1-го этажа, шоу-румы. Классы нагрузки EN 1504-2 и ACI 302.1R до moderate. Не для холодильных камер, не для агрессивной химии, не для улицы.
  en: |
    Two-component epoxy system based on bisphenol-A resin and amine hardener, with quartz filler for thixotropy and wear. Poured onto a primed concrete substrate at 3–5 mm; the low-viscosity blend self-levels under gravity to a flat plane. Once cured, it forms a seamless coating with a smooth semi-gloss finish, moderate chemical resistance, and bond strength to concrete typically exceeding 1.5 MPa.

    Standard build-up: 2-component primer (~250 g/m²), self-leveling pour 3–5 mm, optional topcoat for UV or abrasion. Without topcoat, useful life drops 30–40% under heavy foot traffic.

    The industrial workhorse: warehouses, retail, ground-floor parking, showrooms. Load class moderate per EN 1504-2 / ACI 302.1R. Not for cold storage, not for aggressive chemicals, not for exterior UV exposure.

