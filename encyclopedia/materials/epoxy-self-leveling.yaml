faq:
  - q:
      ru: "Можно ли заливать эпоксид прямо на старую плитку?"
      en: "Can you pour epoxy directly over old tile?"
    a:
      ru: "Технически — да, после shotblast или диамантной шлифовки и проверки адгезии каждой плитки на отрыв (≥ 1.5 МПа). Практически — отрицательный совет: швы между плитками работают как тепловые мосты и проступают трещинами через 6–12 мес. Лучше демонтировать плитку или сделать самонивелирующую цементную стяжку 5–10 мм поверх как разделительный слой."
      en: "Technically yes — after shotblasting or diamond grinding and pull-off testing of each tile (≥ 1.5 MPa). In practice we advise against: grout joints act as thermal bridges and telegraph as cracks within 6–12 months. Strip the tile, or pour a 5–10 mm self-leveling cement screed as a decoupling layer."
  - q:
      ru: "Сколько объект простаивает?"
      en: "How much downtime?"
    a:
      ru: "Минимум 4 рабочих дня + 24 часа на пешеходную нагрузку и 7 суток на полную химическую полимеризацию. Тяжёлая техника / ричтраки — не раньше 7 дней."
      en: "Minimum 4 working days + 24 hours before walking + 7 days for full chemical cure. Heavy equipment and reach trucks — not before 7 days."
  - q:
      ru: "Гарантия?"
      en: "Warranty?"
    a:
      ru: "Floor.DSGN даёт 5 лет на адгезию и 2 года на износ топкоата при условии корректной эксплуатации (без термошока, без пиктовых нагрузок > заявленных, регулярная мойка нейтральными средствами). Гарантия аннулируется при несанкционированных ремонтах самонанесением."
      en: "Floor.DSGN warrants adhesion for 5 years and topcoat wear for 2 years, conditional on proper use (no thermal shock, point loads within spec, neutral pH cleaning). DIY repairs void warranty."

