# ═════════ §5 — подводные камни ═════════
pitfalls:
  - name: "Pinholes от газовыделения основания"
    cause: "Воздух выходит из пор бетона при тёплой плите и охлаждающемся помещении (или наоборот). Если праймер не успел закрыть поры или нанесён тонким слоем — пузыри проходят сквозь наливной слой и оставляют точечные кратеры."
    fix: "Праймер в 2 прохода, второй — с кварцевым посыпом. Заливка в стабильном температурном режиме (+18…+22°C, плита и воздух с разницей ≤ 3°C). Игольчатый валик через 5–10 мин после заливки."
  - name: "Adhesion failure (расслоение)"
    cause: "Влажность основания > 4% RH или vapour drive снизу (нет гидроизоляции под плитой)."
    fix: "Перед нанесением — обязательный замер RH тестом Tramex или ASTM F2170. При сомнении — 2-компонентный moisture-mitigation primer (epoxy с амино-силановой подложкой)."
  - name: "Цвет уплыл между партиями"
    cause: "Пигмент-паста разных производственных партий даёт разные ΔE. На стыке заливок видна полоса."
    fix: "Заказывать материал одной партией (ask for `batch number` в Sika IL) на весь объект; границы заливок проводить по линиям швов, а не по середине пролёта."
  - name: "Желтизна / мелование"
    cause: "Прямой УФ (окна, открытые ворота). Bisphenol-A теряет хромофоры через 6–18 мес."
    fix: "Алифатический PU-топкоат (Sikafloor-264 + Sikafloor-359 N) или замена на 100%-PU систему."
  - name: "Hairline cracks через швы"
    cause: "Эпоксид заполнил статический шов, не дал ему работать."
    fix: "Швы режутся диск-резкой по покрытию ровно над швом плиты, заполняются полиуретановым герметиком. Reviewer материала: 'не покрывать дилатационные швы'."

# ═════════ §6 — альтернативы ═════════
alternatives:
  - slug: "epoxy-troweled-hbs"
    when: "Если нагрузка тяжелее (heavy forklift > 5 т, abrasion класс > AR 0.5) — нужен Heavy-Body Screed 6–12 мм"
  - slug: "pu-cement"
    when: "Если бывает термошок, мойка горячей водой, влажные процессы или химия — PU-цемент в разы устойчивее"
  - slug: "polished-concrete-cream"
    when: "Если бюджет жёсткий и нужен только лёгкий retail без специальных требований — шлифовка существующей плиты дешевле"
  - slug: "mma-fast-cure"
    when: "Если простой объекта < 8 часов критичен (пищевое производство, аптека) — MMA встаёт за 2 часа"
  - slug: "microcement"
    when: "Если ключевое — эстетика и residential interior — микроцемент даёт 2-3 мм минеральный финиш"

