# ═════════ §3 — fit / not-fit ═════════
fit:
  good:
    - "Warehouses (light-to-moderate forklift, ≤ 3 т)"
    - "Retail и shopping centers"
    - "Ground-floor parking без термошока"
    - "Showrooms, galleries"
    - "Pharma и food (только с пищевым топкоатом + интегрированными coving)"
    - "Light manufacturing"
  bad:
    - "Холодильные камеры < 0°C (термоудар → растрескивание)"
    - "Прямой контакт с агрессивной химией (concentrated acids, aromatic solvents)"
    - "Наружные площадки под прямым УФ (желтеет, мелит)"
    - "Полы с постоянной влагой / wet processing (PU-cement лучше)"
    - "Heavy industrial с динамическими ударными нагрузками (нужен HBS troweled)"
  why:
    ru: |
      Эпоксид жёсткий и прочный, но не эластичный. Любые движения основания — термические, усадочные, сейсмические — переходят в трещины покрытия. Холодильные камеры дают разницу температур до 40°C между полом и воздухом — это гарантированное расслоение через 1–3 года. Под УФ Bisphenol-A теряет хромофоры и желтеет; стандартная система это не топкоат с алифатическим PU. Для влажных процессов проблема в обратном — пары воды через бетон создают давление под покрытием (vapor drive), и эпоксид отрывается, потому что не пропускает пар. PU-cement специально проектируется как paste-through для таких случаев.
    en: |
      Epoxy is hard and strong but not elastic. Any substrate movement — thermal, shrinkage, seismic — telegraphs through as cracks in the coating. Cold rooms see swings up to 40°C between floor and air, which guarantees delamination within 1–3 years. Under UV exposure, bisphenol-A loses chromophores and yellows; the standard system has no aliphatic PU topcoat. In wet-processing environments the issue is reversed: water vapour migrating through concrete builds pressure under the impermeable epoxy film (vapour drive), and the coating debonds. PU-cement is specifically engineered as a vapour-permeable system for these cases.

# ═════════ §4 — технология монтажа ═════════
installation:
  substrate_requirements:
    - "Бетон CT-C25-F4 минимум, EN 13813"
    - "Возраст плиты ≥ 28 дней"
    - "Влажность бетона RH < 4% по Tramex CMEx II или RH < 75% по ASTM F2170 (зонд)"
    - "Прочность на отрыв ≥ 1.5 МПа (pull-off, EN 1542)"
    - "Profile CSP 2–3 после shotblast (ICRI Guideline 310.2R)"
    - "Отсутствие масляных и силиконовых загрязнений (UV-lamp test)"
    - "Уклон с готовой геометрией ± 3 мм / 2 м"
  steps:
    - name: "Shotblast / diamond grinding"
      purpose: "Механическая адгезия, удаление laitance и поверхностных загрязнений"
      time_h: 2
      consumables_kg_m2: 0
    - name: "Crack and joint repair"
      purpose: "Заделка ремонтным эпоксидом ≥ 1 мм трещин, статические швы оставляем"
      time_h: 1
      consumables_kg_m2: 0.05
    - name: "Primer 2-component"
      purpose: "Связь с основанием + закрытие пор для предотвращения pinholes"
      time_h: 1
      consumables_kg_m2: 0.25
    - name: "Self-level pour 3–5 mm"
      purpose: "Основной слой, заливка зубчатым шпателем + игольчатый валик"
      time_h: 3
      consumables_kg_m2: 5.5
    - name: "Topcoat (опционально)"
      purpose: "Износо- и УФ-защита; даёт matt/satin/gloss финиш"
      time_h: 1
      consumables_kg_m2: 0.15
