<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>Floor.DSGN — пол в интерьере (превью)</title>
<style>
  :root{--mono:'JetBrains Mono',ui-monospace,Menlo,monospace;--sans:-apple-system,BlinkMacSystemFont,'Montserrat',sans-serif}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#0b0b0c;overflow:hidden;font-family:var(--sans);-webkit-font-smoothing:antialiased}
  #app{position:fixed;inset:0}
  canvas{display:block;width:100%!important;height:100%!important;touch-action:none}
  .hud{position:fixed;z-index:5;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.55);pointer-events:none}
  .tl{top:max(14px,env(safe-area-inset-top));left:max(16px,env(safe-area-inset-left))}
  .tl .t{font-weight:600;font-size:15px;letter-spacing:-.01em}
  .tl .s{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;opacity:.82;margin-top:3px}
  .br{bottom:max(74px,calc(env(safe-area-inset-bottom) + 60px));right:max(16px,env(safe-area-inset-right));text-align:right;font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;opacity:.66;line-height:1.5}
  .bar{position:fixed;z-index:6;left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;flex-direction:column;gap:7px;align-items:center}
  .row{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
  .seg{display:flex;gap:0;border:1px solid rgba(255,255,255,.26);border-radius:0;overflow:hidden;-webkit-backdrop-filter:blur(7px);backdrop-filter:blur(7px);background:rgba(18,18,20,.34)}
  .seg button,.chip{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#fff;background:transparent;border:0;padding:9px 13px;cursor:pointer;min-height:40px;transition:background .15s,color .15s;white-space:nowrap}
  .seg button + button{border-left:1px solid rgba(255,255,255,.18)}
  .seg button.on{background:#fff;color:#111}
  .chip{border:1px solid rgba(255,255,255,.26);-webkit-backdrop-filter:blur(7px);backdrop-filter:blur(7px);background:rgba(18,18,20,.34)}
  .chip.on{background:#fff;color:#111;border-color:#fff}
  .lbl{font-family:var(--mono);font-size:8.5px;letter-spacing:.18em;text-transform:uppercase;color:#fff;opacity:.5;margin-bottom:-2px}
  .boot{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#0b0b0c;color:#fff;font-family:var(--mono);font-size:11px;letter-spacing:.22em;text-transform:uppercase;transition:opacity .7s}
  .boot.gone{opacity:0;pointer-events:none}
  .boot .ring{width:26px;height:26px;border:2px solid rgba(255,255,255,.2);border-top-color:#fff;border-radius:50%;animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media (max-width:560px){ .tl .t{font-size:14px} .seg button,.chip{padding:8px 10px;font-size:9px} }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.158.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.158.0/examples/jsm/"
}}
</script>
</head>
<body>
<div id="app"></div>
<div class="hud tl"><div class="t">Floor.DSGN · Epoxy Terrazzo</div><div class="s">пол в интерьере · превью</div></div>
<div class="hud br">3D — визуальная симуляция<br>финал — по физическому образцу</div>

<div class="bar">
  <div class="row" id="floorCtl">
    <span class="lbl" style="align-self:center">терраццо</span>
    <button class="chip on" data-fl="light">Светлое</button>
    <button class="chip" data-fl="venetian">Венеция</button>
  </div>
  <div class="row" id="viewCtl">
    <span class="lbl" style="align-self:center">вид</span>
    <button class="chip on" data-v="hall">Обзор</button>
    <button class="chip" data-v="window">Окно</button>
    <button class="chip" data-v="detail">Деталь</button>
  </div>
  <div class="seg" id="finishCtl">
    <button data-f="satin" class="on">Сатин</button>
    <button data-f="polished">Полировка</button>
    <button data-f="matte">Мат</button>
  </div>
</div>

<div class="boot" id="boot"><div class="ring"></div><div>Сборка сцены…</div></div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RGBELoader } from 'three/addons/loaders/RGBELoader.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { SSAOPass } from 'three/addons/postprocessing/SSAOPass.js';
import { BokehPass } from 'three/addons/postprocessing/BokehPass.js';

/* ───────────────── assets ───────────────── */
const WALLT = '3d-assets/textures-v4/microtopping/';
const HDRI = '3d-assets/textures-v4/_hdri/blocky_photo_studio.hdr';

/* ───────────────── palette (Industrial Proof) ───────────────── */
const C = {
  concrete: 0x968d7e, ceiling: 0xbcb6aa, graphite: 0x2c2c2c, carbon: 0x171717,
  signal: 0xc86b3c, oak: 0x7a5a3a,
};

/* ───────────────── renderer ───────────────── */
const app = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
const isMobile = matchMedia('(max-width:900px)').matches || ('ontouchstart' in window);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.92;   // lower key → real shadows, photographic mood
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
app.appendChild(renderer.domElement);
const MAXA = renderer.capabilities.getMaxAnisotropy();

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b0b0c);
scene.fog = new THREE.Fog(0xdadbdd, 18, 64);   // faint aerial depth toward the window

/* ───────────────── room dims (metres) ───────────────── */
const W = 12, D = 8, H = 3.2;
const hw = W/2, hd = D/2;
const TILE = 1.6;

/* ───────────────── camera ───────────────── */
const camera = new THREE.PerspectiveCamera(46, 1, 0.05, 200);
camera.position.set(1.2, 1.55, 3.4);

const pmrem = new THREE.PMREMGenerator(renderer);
pmrem.compileEquirectangularShader();

/* ───────────────── texture loader ───────────────── */
const texLoader = new THREE.TextureLoader();
function loadTex(p, srgb, repX, repY) {
  const t = texLoader.load(p);
  t.colorSpace = srgb ? THREE.SRGBColorSpace : THREE.NoColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.anisotropy = MAXA; t.repeat.set(repX, repY);
  return t;
}

/* ───────────────── floor (hero) — switchable terrazzo ───────────────── */
const fW = W + 2, fD = D + 2;
const FLOORS = {
  light:    { path: '3d-assets/textures-v4/terrazzo-acg/',      tile: 1.5, ns: 0.5 },  // seamless light grey, on-spec
  venetian: { path: '3d-assets/textures-v4/terrazzo-venetian/', tile: 1.6, ns: 0.5 },  // bold, colourful (tiles a little)
};
const floorMat = new THREE.MeshPhysicalMaterial({
  roughness: 1.0, metalness: 0.0, normalScale: new THREE.Vector2(0.5, 0.5),
  clearcoat: 1.0, clearcoatRoughness: 0.10, envMapIntensity: 1.1,
});
function setFloor(key){
  const f = FLOORS[key]; if(!f) return;
  const rxx = fW/f.tile, ryy = fD/f.tile;
  const old = [floorMat.map, floorMat.normalMap, floorMat.roughnessMap];
  floorMat.map          = loadTex(f.path+'diffuse.jpg',  true,  rxx, ryy);
  floorMat.normalMap    = loadTex(f.path+'normal.jpg',   false, rxx, ryy);
  floorMat.roughnessMap = loadTex(f.path+'roughness.jpg',false, rxx, ryy);
  floorMat.normalScale.set(f.ns, f.ns); floorMat.needsUpdate = true;
  old.forEach(t => t && t.dispose());
}
setFloor('light');
const floor = new THREE.Mesh(new THREE.PlaneGeometry(fW, fD), floorMat);
floor.rotation.x = -Math.PI/2; floor.receiveShadow = true; scene.add(floor);

/* ───────────────── helpers ───────────────── */
const box = (w,h,d, mat, x,y,z, cast=true, recv=true) => {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat);
  m.position.set(x,y,z); m.castShadow=cast; m.receiveShadow=recv; scene.add(m); return m;
};
const rbox = (w,h,d, mat, x,y,z, r=0.02, cast=true, recv=true) => {
  const m = new THREE.Mesh(new RoundedBoxGeometry(w,h,d,4,r), mat);
  m.position.set(x,y,z); m.castShadow=cast; m.receiveShadow=recv; scene.add(m); return m;
};

/* ───────────────── shell: textured walls + ceiling ───────────────── */
const wallMat = new THREE.MeshStandardMaterial({
  color: C.concrete, roughness: 0.97, metalness: 0.0,
  normalMap: loadTex(WALLT + 'normal.png', false, 6, 3),
  normalScale: new THREE.Vector2(0.22, 0.22),
  roughnessMap: loadTex(WALLT + 'roughness.png', false, 6, 3),
});
box(0.2, H, D, wallMat, -hw, H/2, 0, false, true);
box(0.2, H, D, wallMat,  hw, H/2, 0, false, true);
box(W, H, 0.2, wallMat, 0, H/2, hd, false, true);
box(W, 0.2, D, new THREE.MeshStandardMaterial({ color: C.ceiling, roughness: 0.98 }), 0, H + 0.1, 0, false, true);

/* far wall around a big window band (y 0.95 → 2.55) */
const winB = 0.95, winT = 2.55, jamb = 0.5;
box(W, winB, 0.2, wallMat, 0, winB/2, -hd);
box(W, H-winT, 0.2, wallMat, 0, winT + (H-winT)/2, -hd);
box(jamb, winT-winB, 0.2, wallMat, -hw + jamb/2, (winB+winT)/2, -hd);
box(jamb, winT-winB, 0.2, wallMat,  hw - jamb/2, (winB+winT)/2, -hd);

/* daylight = the soft HDRI backdrop showing THROUGH the window (set on HDRI load) —
   reads more real than a flat bright plane. Here we just build the window frame. */
const mullMat = new THREE.MeshStandardMaterial({ color: 0xb0aa9e, roughness: 0.85 });
box(0.07, winT-winB, 0.07, mullMat, -W*0.17, (winB+winT)/2, -hd+0.02);
box(0.07, winT-winB, 0.07, mullMat,  W*0.17, (winB+winT)/2, -hd+0.02);
box(W-2*jamb, 0.07, 0.07, mullMat, 0, (winB+winT)/2, -hd+0.02);   // transom

/* ceiling light strips (emissive) → linear reflections */
const stripMat = new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0xfff2e2, emissiveIntensity: 1.5, roughness: 1, fog:false });
for (const sx of [-3.2, 0, 3.2]) box(0.14, 0.04, D*0.66, stripMat, sx, H-0.02, -0.3, false, false);

/* ───────────────── furniture (rounded, metric) ───────────────── */
const benchMat = new THREE.MeshStandardMaterial({ color: C.carbon, roughness: 0.85, metalness: 0.03 });
rbox(0.55, 0.42, 2.6, benchMat, hw-0.55, 0.21, -0.2, 0.03);
rbox(0.5, 0.07, 2.5, new THREE.MeshStandardMaterial({ color: C.graphite, roughness: 0.62 }), hw-0.55, 0.455, -0.2, 0.025);

const oakMat = new THREE.MeshStandardMaterial({ color: C.oak, roughness: 0.5, metalness: 0.0 });
const legMat = new THREE.MeshStandardMaterial({ color: C.carbon, roughness: 0.5, metalness: 0.25 });
rbox(1.25, 0.07, 0.62, oakMat, 0.1, 0.42, 1.35, 0.02);
for (const [lx,lz] of [[-0.5,-0.24],[0.5,-0.24],[-0.5,0.24],[0.5,0.24]]) {
  const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.022,0.022,0.40,16), legMat);
  leg.position.set(0.1+lx, 0.20, 1.35+lz); leg.castShadow=true; leg.receiveShadow=true; scene.add(leg);
}

/* focal piece: matte ceramic vase on a slim stone pedestal (gallery, not a CG cube) */
const ped = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.18, 0.55, 40),
  new THREE.MeshStandardMaterial({ color: 0xb3a791, roughness: 0.74 }));   // warm travertine, reads under the white vase
ped.position.set(-0.4, 0.275, -1.5); ped.castShadow = ped.receiveShadow = true; scene.add(ped);
const vaseProfile = [[0,0],[0.085,0],[0.10,0.03],[0.135,0.14],[0.155,0.24],[0.135,0.33],[0.10,0.40],[0.085,0.45],[0.095,0.47]]
  .map(p => new THREE.Vector2(p[0], p[1]));
const vase = new THREE.Mesh(new THREE.LatheGeometry(vaseProfile, 48),
  new THREE.MeshPhysicalMaterial({ color: 0xe7e0d3, roughness: 0.5, metalness: 0.0, clearcoat: 0.25, clearcoatRoughness: 0.5 }));
vase.position.set(-0.4, 0.55, -1.5); vase.castShadow = true; vase.receiveShadow = true; scene.add(vase);

/* Signal-accent art panel on the left wall (single brand accent) */
box(0.07, 1.5, 2.05, new THREE.MeshStandardMaterial({ color: 0xf3f0ea, roughness: 0.85 }), -hw+0.10, 1.65, -0.4, true, false);
box(0.05, 1.35, 1.9, new THREE.MeshStandardMaterial({ color: C.signal, roughness: 0.78 }), -hw+0.13, 1.65, -0.4);

/* arc floor lamp, left-front (warm point light + tall reflection) */
const lampMet = new THREE.MeshStandardMaterial({ color: 0x20201e, roughness: 0.4, metalness: 0.6 });
const lampBase = new THREE.Mesh(new THREE.CylinderGeometry(0.17,0.19,0.05,32), lampMet);
lampBase.position.set(-3.4,0.025,1.7); lampBase.castShadow=true; lampBase.receiveShadow=true; scene.add(lampBase);
const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.022,0.026,2.15,20), lampMet);
pole.position.set(-3.4,1.1,1.7); pole.castShadow=true; scene.add(pole);
const arm = new THREE.Mesh(new THREE.CylinderGeometry(0.02,0.02,1.0,16), lampMet);
arm.position.set(-3.05,2.12,1.55); arm.rotation.z = Math.PI*0.42; arm.rotation.y = -0.3; arm.castShadow=true; scene.add(arm);
const shade = new THREE.Mesh(new THREE.ConeGeometry(0.16,0.22,28,1,true),
  new THREE.MeshStandardMaterial({ color: 0x2a2a28, roughness:0.6, metalness:0.3, side: THREE.DoubleSide, emissive:0xffce8a, emissiveIntensity:0.30 }));
shade.position.set(-2.7,2.02,1.42); shade.rotation.x = Math.PI; scene.add(shade);
const lampLight = new THREE.PointLight(0xffd29a, 3.0, 5, 2.0);
lampLight.position.set(-2.7,1.9,1.42); scene.add(lampLight);

/* live plant (snake plant) in the far-left corner — organic life */
const plant = new THREE.Group();
const pot = new THREE.Mesh(new THREE.CylinderGeometry(0.17,0.13,0.34,28),
  new THREE.MeshStandardMaterial({ color: 0x8a5a44, roughness: 0.9 }));
pot.position.y = 0.17; pot.castShadow = pot.receiveShadow = true; plant.add(pot);
const soil = new THREE.Mesh(new THREE.CylinderGeometry(0.155,0.155,0.02,24),
  new THREE.MeshStandardMaterial({ color: 0x241c14, roughness: 1 }));
soil.position.y = 0.335; plant.add(soil);
const bladeDark = new THREE.MeshStandardMaterial({ color: 0x33502f, roughness: 0.72, side: THREE.DoubleSide });
const bladeLite = new THREE.MeshStandardMaterial({ color: 0x4a6b3a, roughness: 0.72, side: THREE.DoubleSide });
const NB = 9;
for (let i=0;i<NB;i++){
  const a = (i/NB)*Math.PI*2;
  const h = 0.62 + ((i*37)%5)*0.09;
  const lean = 0.10 + ((i*53)%4)*0.05;
  const blade = new THREE.Mesh(new THREE.BoxGeometry(0.065,h,0.014), (i%3===0)?bladeLite:bladeDark);
  blade.position.set(Math.cos(a)*0.05, 0.34 + h/2*Math.cos(lean), Math.sin(a)*0.05);
  blade.rotation.set(Math.sin(a)*lean, -a, -Math.cos(a)*lean);
  blade.castShadow = true; plant.add(blade);
}
plant.position.set(-4.6, 0, -2.7); scene.add(plant);

/* ───────────────── lighting (cool daylight + warm interior) ───────────────── */
scene.add(new THREE.HemisphereLight(0xeef3ff, 0x201d18, 0.34));   // less flat fill → sun models the room
const sun = new THREE.DirectionalLight(0xf2f5ff, 2.7);     // cool daylight through the window
sun.position.set(-2.5, 6.5, -10); sun.target.position.set(0.5, 0.2, 1);
sun.castShadow = true;
sun.shadow.mapSize.set(isMobile?1024:2048, isMobile?1024:2048);
sun.shadow.camera.near = 1; sun.shadow.camera.far = 30;
sun.shadow.camera.left=-9; sun.shadow.camera.right=9; sun.shadow.camera.top=9; sun.shadow.camera.bottom=-9;
sun.shadow.bias=-0.0004; sun.shadow.normalBias=0.02;
scene.add(sun); scene.add(sun.target);
const fill = new THREE.DirectionalLight(0xf2ead8, 0.22); fill.position.set(3,4,8); scene.add(fill);

/* ───────────────── floor reflections (CubeCamera, baked once) ───────────────── */
const cubeRes = isMobile ? 256 : 512;
const cubeRT = new THREE.WebGLCubeRenderTarget(cubeRes, { type: THREE.HalfFloatType });
const cubeCam = new THREE.CubeCamera(0.1, 100, cubeRT); cubeCam.position.set(0, 0.5, 0.5);
function bakeFloorReflection(){
  floor.visible = false; cubeCam.update(renderer, scene); floor.visible = true;
  floorMat.envMap = cubeRT.texture; floorMat.envMapIntensity = 1.0; floorMat.needsUpdate = true;
}

/* ───────────────── controls ───────────────── */
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.075;
controls.target.set(0.2, 0.55, -1.2);
controls.minDistance = 1.3; controls.maxDistance = 6.5;
controls.minPolarAngle = Math.PI*0.26; controls.maxPolarAngle = Math.PI*0.495;
controls.enablePan = false; controls.autoRotate = true; controls.autoRotateSpeed = 0.32;
controls.update();
controls.addEventListener('start', () => { controls.autoRotate = false; });

/* ───────────────── view presets ───────────────── */
const VIEWS = {
  hall:   { p:[1.2,1.55,3.4],  t:[0.2,0.55,-1.2] },
  window: { p:[0.4,1.35,2.4],  t:[0.0,1.4,-hd]   },
  detail: { p:[0.25,0.6,1.35], t:[0.1,0.02,0.2]  },
};
let tween = null;
function goView(name){
  const v = VIEWS[name]; if(!v) return;
  controls.autoRotate = false;
  tween = { t0:0, dur:46, p0:camera.position.clone(), p1:new THREE.Vector3(...v.p),
            g0:controls.target.clone(), g1:new THREE.Vector3(...v.t) };
}
document.querySelectorAll('#viewCtl .chip').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('#viewCtl .chip').forEach(x => x.classList.remove('on'));
  b.classList.add('on'); goView(b.dataset.v);
}));
document.querySelectorAll('#floorCtl .chip').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('#floorCtl .chip').forEach(x => x.classList.remove('on'));
  b.classList.add('on'); setFloor(b.dataset.fl);
}));

/* ───────────────── finish control → clearcoat sheen ───────────────── */
const FIN = { matte: 0.55, satin: 0.12, polished: 0.025 };
document.querySelectorAll('#finishCtl button').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('#finishCtl button').forEach(x => x.classList.remove('on'));
  b.classList.add('on');
  floorMat.clearcoatRoughness = FIN[b.dataset.f] ?? 0.12; floorMat.needsUpdate = true;
}));

/* ───────────────── filmic post-processing ───────────────── */
const GradeShader = {
  uniforms: { tDiffuse:{value:null}, uTime:{value:0}, uVignette:{value:1.0}, uGrain:{value:0.055}, uCA:{value:0.0018} },
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
  fragmentShader: `
    uniform sampler2D tDiffuse; uniform float uTime,uVignette,uGrain,uCA; varying vec2 vUv;
    float rand(vec2 c){ return fract(sin(dot(c, vec2(12.9898,78.233)))*43758.5453); }
    void main(){
      vec2 uv=vUv, d=uv-0.5; float r=length(d);
      vec2 off = d * uCA * r * 2.0;
      vec3 col = vec3(texture2D(tDiffuse, uv+off).r, texture2D(tDiffuse, uv).g, texture2D(tDiffuse, uv-off).b);
      float vig = 1.0 - smoothstep(0.28, 0.92, r*uVignette);
      col *= mix(0.58, 1.0, vig);
      col += (rand(uv*(uTime*0.6+1.0))-0.5) * uGrain;
      gl_FragColor = vec4(col, 1.0);
    }`
};
let composer=null, gradePass=null, useComposer=false;
function setupComposer(){
  try{
    composer = new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene, camera));
    if(!isMobile){
      const ssao = new SSAOPass(scene, camera, app.clientWidth, app.clientHeight);
      ssao.kernelRadius = 0.5; ssao.minDistance = 0.0015; ssao.maxDistance = 0.05;
      composer.addPass(ssao);
      // depth of field → photographic focus (window/foreground soften, floor mid stays crisp)
      composer.addPass(new BokehPass(scene, camera, { focus: 3.0, aperture: 0.0007, maxblur: 0.005 }));
    }
    composer.addPass(new UnrealBloomPass(new THREE.Vector2(app.clientWidth, app.clientHeight), isMobile?0.18:0.24, 0.55, 0.9));
    composer.addPass(new OutputPass());
    gradePass = new ShaderPass(GradeShader); composer.addPass(gradePass);
    useComposer = true;
  } catch(e){ console.error('composer setup failed → direct render', e); useComposer = false; }
}
setupComposer();

/* ───────────────── HDRI env, then bake & reveal ───────────────── */
function reveal(){ document.getElementById('boot').classList.add('gone'); }
new RGBELoader().load(HDRI, (hdr) => {
  hdr.mapping = THREE.EquirectangularReflectionMapping;
  scene.environment = pmrem.fromEquirectangular(hdr).texture;
  scene.background = hdr;                  // soft daylight visible through the window
  scene.backgroundBlurriness = 0.38;       // (don't dispose hdr — it's the backdrop now)
  bakeFloorReflection(); reveal();
}, undefined, () => { bakeFloorReflection(); reveal(); });

/* ───────────────── resize + loop ───────────────── */
function resize(){
  const w = app.clientWidth, h = app.clientHeight;
  renderer.setSize(w,h,false); camera.aspect = w/Math.max(1,h); camera.updateProjectionMatrix();
  if(composer) composer.setSize(w,h);
}
new ResizeObserver(resize).observe(app); resize();

window.__room = { scene, camera, renderer, floorMat, controls, bake: bakeFloorReflection, goView,
                  grade: ()=>gradePass && gradePass.uniforms };

(function loop(){
  if (tween){
    tween.t0++; const k = tween.t0/tween.dur, e = k<1 ? (1-Math.pow(1-k,3)) : 1;
    camera.position.lerpVectors(tween.p0, tween.p1, e);
    controls.target.lerpVectors(tween.g0, tween.g1, e);
    if (k>=1) tween = null;
  }
  controls.update();
  if (gradePass) gradePass.uniforms.uTime.value = performance.now()*0.001;
  if (useComposer && composer) composer.render(); else renderer.render(scene, camera);
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
