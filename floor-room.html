<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>Floor.DSGN — пол в интерьере (превью)</title>
<style>
  :root{--mono:'JetBrains Mono',ui-monospace,Menlo,monospace;--sans:-apple-system,BlinkMacSystemFont,'Montserrat',sans-serif}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#0b0b0c;overflow:hidden;font-family:var(--sans);-webkit-font-smoothing:antialiased}
  #app{position:fixed;inset:0}
  canvas{display:block;width:100%!important;height:100%!important;touch-action:none}
  .hud{position:fixed;z-index:5;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.55);pointer-events:none}
  .tl{top:max(14px,env(safe-area-inset-top));left:max(16px,env(safe-area-inset-left))}
  .tl .t{font-weight:600;font-size:15px;letter-spacing:-.01em}
  .tl .s{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;opacity:.82;margin-top:3px}
  .br{bottom:max(74px,calc(env(safe-area-inset-bottom) + 60px));right:max(16px,env(safe-area-inset-right));text-align:right;font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;opacity:.66;line-height:1.5}
  /* bottom control bar */
  .bar{position:fixed;z-index:6;left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;flex-direction:column;gap:7px;align-items:center}
  .row{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
  .seg{display:flex;gap:0;border:1px solid rgba(255,255,255,.26);border-radius:0;overflow:hidden;-webkit-backdrop-filter:blur(7px);backdrop-filter:blur(7px);background:rgba(18,18,20,.34)}
  .seg button,.chip{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#fff;background:transparent;border:0;padding:9px 13px;cursor:pointer;min-height:40px;transition:background .15s,color .15s;white-space:nowrap}
  .seg button + button{border-left:1px solid rgba(255,255,255,.18)}
  .seg button.on{background:#fff;color:#111}
  .chip{border:1px solid rgba(255,255,255,.26);-webkit-backdrop-filter:blur(7px);backdrop-filter:blur(7px);background:rgba(18,18,20,.34)}
  .chip.on{background:#fff;color:#111;border-color:#fff}
  .lbl{font-family:var(--mono);font-size:8.5px;letter-spacing:.18em;text-transform:uppercase;color:#fff;opacity:.5;margin-bottom:-2px}
  .boot{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#0b0b0c;color:#fff;font-family:var(--mono);font-size:11px;letter-spacing:.22em;text-transform:uppercase;transition:opacity .7s}
  .boot.gone{opacity:0;pointer-events:none}
  .boot .ring{width:26px;height:26px;border:2px solid rgba(255,255,255,.2);border-top-color:#fff;border-radius:50%;animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media (max-width:560px){ .tl .t{font-size:14px} .seg button,.chip{padding:8px 10px;font-size:9px} }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.158.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.158.0/examples/jsm/"
}}
</script>
</head>
<body>
<div id="app"></div>
<div class="hud tl"><div class="t">Floor.DSGN · Epoxy Terrazzo</div><div class="s">пол в интерьере · превью</div></div>
<div class="hud br">3D — визуальная симуляция<br>финал — по физическому образцу</div>

<div class="bar">
  <div class="row" id="viewCtl">
    <span class="lbl" style="align-self:center">вид</span>
    <button class="chip on" data-v="hall">Обзор</button>
    <button class="chip" data-v="window">Окно</button>
    <button class="chip" data-v="detail">Деталь</button>
  </div>
  <div class="seg" id="finishCtl">
    <button data-f="satin" class="on">Сатин</button>
    <button data-f="polished">Полировка</button>
    <button data-f="matte">Мат</button>
  </div>
</div>

<div class="boot" id="boot"><div class="ring"></div><div>Сборка сцены…</div></div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RGBELoader } from 'three/addons/loaders/RGBELoader.js';

/* ───────────────── assets ───────────────── */
const TEX  = '3d-assets/textures-v4/terrazzo-venetian/';
const HDRI = '3d-assets/textures-v4/_hdri/blocky_photo_studio.hdr';

/* ───────────────── palette (Industrial Proof) ───────────────── */
const C = {
  concrete: 0xe9e5dc,   // walls — warm off-white
  ceiling:  0xf1eee7,
  graphite: 0x2c2c2c,
  carbon:   0x171717,
  signal:   0xc86b3c,   // the single accent (art panel)
  oak:      0x7a5a3a,
  steel:    0x8d8b85,
  daylight: 0xfff4e6,   // window glow
};

/* ───────────────── renderer ───────────────── */
const app = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
const isMobile = matchMedia('(max-width:900px)').matches || ('ontouchstart' in window);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
app.appendChild(renderer.domElement);
const MAXA = renderer.capabilities.getMaxAnisotropy();

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b0b0c);
// faint aerial haze toward the bright far window → depth
scene.fog = new THREE.Fog(0xdfe0e2, 16, 60);

/* ───────────────── room dims (metres, floor centred at origin) ───────────────── */
const W = 12, D = 8, H = 3.2;          // width(x) · depth(z) · height(y)
const hw = W/2, hd = D/2;              // far wall at z=-hd has the window
const TILE = 1.6;                      // terrazzo tile size in metres

/* ───────────────── camera ───────────────── */
const camera = new THREE.PerspectiveCamera(46, 1, 0.05, 200);
camera.position.set(1.2, 1.55, 3.4);

const pmrem = new THREE.PMREMGenerator(renderer);
pmrem.compileEquirectangularShader();

/* ───────────────── texture loading ───────────────── */
const texLoader = new THREE.TextureLoader();
function loadTex(p, srgb, repX, repY) {
  const t = texLoader.load(p);
  t.colorSpace = srgb ? THREE.SRGBColorSpace : THREE.NoColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.anisotropy = MAXA;
  t.repeat.set(repX, repY);
  return t;
}

/* ───────────────── floor (the hero) ───────────────── */
const fW = W + 2, fD = D + 2;          // tuck a little under the walls
const rx = fW / TILE, ry = fD / TILE;
const floorMat = new THREE.MeshPhysicalMaterial({
  map:          loadTex(TEX + 'diffuse.jpg',  true,  rx, ry),
  normalMap:    loadTex(TEX + 'normal.jpg',   false, rx, ry),
  roughnessMap: loadTex(TEX + 'roughness.jpg',false, rx, ry),
  roughness: 1.0,
  metalness: 0.0,
  normalScale: new THREE.Vector2(0.55, 0.55),
  clearcoat: 1.0,
  clearcoatRoughness: 0.10,            // satin default; finish control adjusts
  envMapIntensity: 1.15,
});
const floor = new THREE.Mesh(new THREE.PlaneGeometry(fW, fD), floorMat);
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);

/* ───────────────── material helpers ───────────────── */
const matWall = (col) => new THREE.MeshStandardMaterial({ color: col, roughness: 0.94, metalness: 0.0 });
const box = (w,h,d, mat, x,y,z, cast=true, recv=true) => {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat);
  m.position.set(x,y,z); m.castShadow = cast; m.receiveShadow = recv;
  scene.add(m); return m;
};

/* ───────────────── shell: walls + ceiling ───────────────── */
const wallMat = matWall(C.concrete);
// left / right
box(0.2, H, D, wallMat, -hw, H/2, 0, false, true);
box(0.2, H, D, wallMat,  hw, H/2, 0, false, true);
// front (behind camera)
box(W, H, 0.2, wallMat, 0, H/2,  hd, false, true);
// ceiling
box(W, 0.2, D, matWall(C.ceiling), 0, H + 0.1, 0, false, true);

/* far wall built AROUND a big window band (y 0.95 → 2.55) */
const winB = 0.95, winT = 2.55, jamb = 0.5;
box(W, winB, 0.2, wallMat, 0, winB/2,          -hd);                 // sill strip
box(W, H - winT, 0.2, wallMat, 0, winT + (H-winT)/2, -hd);           // head strip
box(jamb, winT-winB, 0.2, wallMat, -hw + jamb/2, (winB+winT)/2, -hd);// left jamb
box(jamb, winT-winB, 0.2, wallMat,  hw - jamb/2, (winB+winT)/2, -hd);// right jamb

/* bright daylight backdrop behind the window → this is what the floor reflects */
const dayMat = new THREE.MeshBasicMaterial({ color: C.daylight, fog: false });
const day = new THREE.Mesh(new THREE.PlaneGeometry(W*1.4, H*1.6), dayMat);
day.position.set(0, H*0.55, -hd - 0.5);
scene.add(day);
// thin mullions across the window (two verticals) for a designed look + reflection rhythm
const mullMat = matWall(0xcfcabf);
box(0.06, winT-winB, 0.06, mullMat, -W*0.17, (winB+winT)/2, -hd+0.02);
box(0.06, winT-winB, 0.06, mullMat,  W*0.17, (winB+winT)/2, -hd+0.02);

/* ceiling light strips (emissive) → linear reflections on the floor */
const stripMat = new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0xfff4e8, emissiveIntensity: 1.4, roughness: 1, fog:false });
for (const sx of [-3.2, 0, 3.2]) box(0.14, 0.04, D*0.66, stripMat, sx, H - 0.02, -0.3, false, false);

/* ───────────────── furniture (minimal gallery set, metric) ───────────────── */
// low bench against the right wall
const benchMat = new THREE.MeshStandardMaterial({ color: C.carbon, roughness: 0.82, metalness: 0.04 });
box(0.55, 0.42, 2.6, benchMat, hw - 0.55, 0.21, -0.2);
box(0.5, 0.06, 2.5, new THREE.MeshStandardMaterial({ color: C.graphite, roughness: 0.6 }), hw - 0.55, 0.45, -0.2); // seat pad

// oak coffee-table slab + legs, centre-front
const oakMat = new THREE.MeshStandardMaterial({ color: C.oak, roughness: 0.55, metalness: 0.0 });
const legMat = new THREE.MeshStandardMaterial({ color: C.carbon, roughness: 0.5, metalness: 0.2 });
box(1.25, 0.07, 0.62, oakMat, 0.1, 0.42, 1.35);
for (const [lx,lz] of [[-0.5,-0.24],[0.5,-0.24],[-0.5,0.24],[0.5,0.24]]) {
  const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.022,0.022,0.40,16), legMat);
  leg.position.set(0.1+lx, 0.20, 1.35+lz); leg.castShadow=true; leg.receiveShadow=true; scene.add(leg);
}

// focal piece: brushed-metal sphere on a graphite plinth (reflects the room)
const plinth = box(0.5, 0.42, 0.5, new THREE.MeshStandardMaterial({ color: C.graphite, roughness: 0.85 }), -0.4, 0.21, -1.5);
const orb = new THREE.Mesh(new THREE.SphereGeometry(0.27, 48, 48),
  new THREE.MeshStandardMaterial({ color: 0xbfc1c4, metalness: 0.95, roughness: 0.22 }));
orb.position.set(-0.4, 0.42 + 0.27, -1.5); orb.castShadow = true; scene.add(orb);

// Signal-accent art panel on the left wall (the single brand accent)
const artMat = new THREE.MeshStandardMaterial({ color: C.signal, roughness: 0.7, emissive: C.signal, emissiveIntensity: 0.06 });
box(0.05, 1.35, 1.9, artMat, -hw + 0.13, 1.65, -0.4);
box(0.07, 1.5, 2.05, new THREE.MeshStandardMaterial({ color: 0xf3f0ea, roughness: 0.8 }), -hw + 0.10, 1.65, -0.4, true, false); // mat/frame behind

// arc floor lamp, left-front (warm point light + tall reflection)
const lampMet = new THREE.MeshStandardMaterial({ color: 0x20201e, roughness: 0.4, metalness: 0.6 });
const lampBase = new THREE.Mesh(new THREE.CylinderGeometry(0.17,0.19,0.05,32), lampMet);
lampBase.position.set(-3.4,0.025,1.7); lampBase.castShadow=true; lampBase.receiveShadow=true; scene.add(lampBase);
const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.022,0.026,2.15,20), lampMet);
pole.position.set(-3.4,1.1,1.7); pole.castShadow=true; scene.add(pole);
const arm = new THREE.Mesh(new THREE.CylinderGeometry(0.02,0.02,1.0,16), lampMet);
arm.position.set(-3.05,2.12,1.55); arm.rotation.z = Math.PI*0.42; arm.rotation.y = -0.3; arm.castShadow=true; scene.add(arm);
const shade = new THREE.Mesh(new THREE.ConeGeometry(0.16,0.22,28,1,true),
  new THREE.MeshStandardMaterial({ color: 0x2a2a28, roughness:0.6, metalness:0.3, side: THREE.DoubleSide, emissive:0xffce8a, emissiveIntensity:0.5 }));
shade.position.set(-2.7,2.02,1.42); shade.rotation.x = Math.PI; scene.add(shade);
const lampLight = new THREE.PointLight(0xffd9a0, 6.0, 7, 2.0);
lampLight.position.set(-2.7,1.92,1.42); scene.add(lampLight);

/* ───────────────── lighting ───────────────── */
scene.add(new THREE.HemisphereLight(0xfff6ec, 0x1c1c1e, 0.55));
const sun = new THREE.DirectionalLight(0xfff1df, 2.3);
sun.position.set(-2.5, 6.5, -10);          // outside, behind the far window, high
sun.target.position.set(0.5, 0.2, 1);
sun.castShadow = true;
sun.shadow.mapSize.set(isMobile ? 1024 : 2048, isMobile ? 1024 : 2048);
sun.shadow.camera.near = 1; sun.shadow.camera.far = 30;
sun.shadow.camera.left = -9; sun.shadow.camera.right = 9;
sun.shadow.camera.top = 9; sun.shadow.camera.bottom = -9;
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.02;
scene.add(sun); scene.add(sun.target);
// soft fill from camera side so foreground isn't muddy
const fill = new THREE.DirectionalLight(0xeaf0ff, 0.35);
fill.position.set(3, 4, 8); scene.add(fill);

/* ───────────────── floor reflections (CubeCamera baked once) ───────────────── */
const cubeRes = isMobile ? 256 : 512;
const cubeRT = new THREE.WebGLCubeRenderTarget(cubeRes, { type: THREE.HalfFloatType });
const cubeCam = new THREE.CubeCamera(0.1, 100, cubeRT);
cubeCam.position.set(0, 0.5, 0.5);
function bakeFloorReflection() {
  floor.visible = false;                 // don't reflect the floor into itself
  cubeCam.update(renderer, scene);
  floor.visible = true;
  floorMat.envMap = cubeRT.texture;      // floor reflects the room; others use HDRI
  floorMat.envMapIntensity = 1.0;
  floorMat.needsUpdate = true;
}

/* ───────────────── controls ───────────────── */
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.075;
controls.target.set(0.2, 0.55, -1.2);
controls.minDistance = 1.3;
controls.maxDistance = 6.5;
controls.minPolarAngle = Math.PI * 0.26;
controls.maxPolarAngle = Math.PI * 0.495;   // never under the floor
controls.enablePan = false;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.35;             // gentle showroom turntable
controls.update();
controls.addEventListener('start', () => { controls.autoRotate = false; });

/* ───────────────── view presets (quick lerp) ───────────────── */
const VIEWS = {
  hall:   { p:[1.2,1.55,3.4],  t:[0.2,0.55,-1.2] },
  window: { p:[0.4,1.35,2.4],  t:[0.0,1.4,-hd]   },
  detail: { p:[0.25,0.6,1.35], t:[0.1,0.02,0.2]  },
};
let tween = null;
function goView(name){
  const v = VIEWS[name]; if(!v) return;
  controls.autoRotate = false;
  tween = { t0: 0, dur: 46,
    p0: camera.position.clone(), p1: new THREE.Vector3(...v.p),
    g0: controls.target.clone(), g1: new THREE.Vector3(...v.t) };
}
document.querySelectorAll('#viewCtl .chip').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('#viewCtl .chip').forEach(x => x.classList.remove('on'));
  b.classList.add('on'); goView(b.dataset.v);
}));

/* ───────────────── finish control → clearcoat sheen ───────────────── */
const FIN = { matte: 0.55, satin: 0.12, polished: 0.025 };
document.querySelectorAll('#finishCtl button').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('#finishCtl button').forEach(x => x.classList.remove('on'));
  b.classList.add('on');
  floorMat.clearcoatRoughness = FIN[b.dataset.f] ?? 0.12;
  floorMat.needsUpdate = true;
}));

/* ───────────────── HDRI env, then bake & reveal ───────────────── */
function reveal(){ document.getElementById('boot').classList.add('gone'); }
new RGBELoader().load(HDRI, (hdr) => {
  hdr.mapping = THREE.EquirectangularReflectionMapping;
  scene.environment = pmrem.fromEquirectangular(hdr).texture;   // fill/spec for walls & furniture
  hdr.dispose();
  bakeFloorReflection();
  reveal();
}, undefined, () => { bakeFloorReflection(); reveal(); });

/* ───────────────── resize + loop ───────────────── */
function resize() {
  const w = app.clientWidth, h = app.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / Math.max(1, h);
  camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(app);
resize();

window.__room = { scene, camera, renderer, floorMat, controls, bake: bakeFloorReflection, goView };

(function loop() {
  if (tween) {
    tween.t0++;
    const k = tween.t0 / tween.dur, e = k<1 ? (1 - Math.pow(1-k, 3)) : 1;   // easeOutCubic
    camera.position.lerpVectors(tween.p0, tween.p1, e);
    controls.target.lerpVectors(tween.g0, tween.g1, e);
    if (k >= 1) tween = null;
  }
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
