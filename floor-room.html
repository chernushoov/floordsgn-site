<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RGBELoader } from 'three/addons/loaders/RGBELoader.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { SSAOPass } from 'three/addons/postprocessing/SSAOPass.js';
import { BokehPass } from 'three/addons/postprocessing/BokehPass.js';

/* ───────────────── assets ───────────────── */
const WALLT = '3d-assets/textures-v4/microtopping/';
const HDRI = '3d-assets/textures-v4/_hdri/blocky_photo_studio.hdr';

/* ───────────────── palette (Industrial Proof) ───────────────── */
const C = {
  concrete: 0x968d7e, ceiling: 0xbcb6aa, graphite: 0x2c2c2c, carbon: 0x171717,
  signal: 0xc86b3c, oak: 0x7a5a3a,
};

/* ───────────────── renderer ───────────────── */
const app = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance', preserveDrawingBuffer: true });
const isMobile = matchMedia('(max-width:900px)').matches || ('ontouchstart' in window);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.92;   // lower key → real shadows, photographic mood
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
app.appendChild(renderer.domElement);
const MAXA = renderer.capabilities.getMaxAnisotropy();

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b0b0c);
scene.fog = new THREE.Fog(0xdadbdd, 18, 64);   // faint aerial depth toward the window

/* ───────────────── room dims (metres) ───────────────── */
const W = 12, D = 8, H = 3.2;          // default showcase dims (furniture + views are tuned to these)
const hw = W/2, hd = D/2;
const TILE = 1.6;
let curW = W, curD = D, curH = H;      // live dims — equal to defaults until setRoomDims() is called

/* ───────────────── camera ───────────────── */
const camera = new THREE.PerspectiveCamera(46, 1, 0.05, 200);   // near 0.05 kept: raising it clips the close floor-macro ("detail") view (I1)
camera.position.set(-2.6, 1.9, 3.5);   // opens on the hero "Обзор" framing

const pmrem = new THREE.PMREMGenerator(renderer);
pmrem.compileEquirectangularShader();

/* ───────────────── texture loader ───────────────── */
const texLoader = new THREE.TextureLoader();
function loadTex(p, srgb, repX, repY, mirror) {
  const t = texLoader.load(p);
  t.colorSpace = srgb ? THREE.SRGBColorSpace : THREE.NoColorSpace;
  // mirrored wrap = edges always match → seamless even for non-tileable photoscans
  t.wrapS = t.wrapT = mirror ? THREE.MirroredRepeatWrapping : THREE.RepeatWrapping;
  t.anisotropy = MAXA; t.repeat.set(repX, repY);
  return t;
}

/* ───────────────── floor (hero) — switchable terrazzo ───────────────── */
const fW = W + 2, fD = D + 2;
const FLOORS = {
  light:    { path: '3d-assets/textures-v4/terrazzo-acg-flat/', ext: 'jpg', tile: 1.5, ns: 0.5, label: 'Светлое терраццо' },  // flat-fielded photoscan — no macro-luminance grid
  venetian: { path: '3d-assets/textures-v4/terrazzo-venetian/', ext: 'jpg', tile: 1.6, ns: 0.5, label: 'Венецианское терраццо' },  // bold, colourful
  graphite: { path: '3d-assets/textures-v4/terrazzo-epoxy/',    ext: 'png', tile: 1.1, ns: 0.7, mirror: true, label: 'Графитовое эпокси-терраццо' },  // dark charcoal matrix, white/grey chips
  cement:   { path: '3d-assets/textures-v4/terrazzo-cement/',   ext: 'png', tile: 1.4, ns: 0.6, mirror: true, label: 'Цементное терраццо' },  // warm light-grey cement terrazzo
  comfort:  { path: '3d-assets/textures-v4/comfortfloor/',      ext: 'png', tile: 2.2, ns: 0.25, label: 'Комфорт-пол (кремовый)' },   // warm seamless poured polyurethane
  micro:    { path: '3d-assets/textures-v4/microtopping/',      ext: 'png', tile: 2.2, ns: 0.25, label: 'Микроцемент (серый)' },     // troweled fine cement, no chips
  multi:    { path: '3d-assets/textures-v4/terrazzo-multi/',    ext: 'png', tile: 1.5, ns: 0.5, label: 'Мультиколор терраццо' },     // white matrix, multicolour confetti chips
};
const floorMat = new THREE.MeshPhysicalMaterial({
  roughness: 1.0, metalness: 0.0, normalScale: new THREE.Vector2(0.5, 0.5),
  clearcoat: 1.0, clearcoatRoughness: 0.10, envMapIntensity: 1.1,
});
function setFloor(key){
  const f = FLOORS[key]; if(!f) return;
  const rxx = fW/f.tile, ryy = fD/f.tile;
  const old = [floorMat.map, floorMat.normalMap, floorMat.roughnessMap];
  floorMat.map          = loadTex(f.path+'diffuse.jpg',       true,  rxx, ryy, f.mirror);
  floorMat.normalMap    = loadTex(f.path+'normal.'+f.ext,     false, rxx, ryy, f.mirror);
  floorMat.roughnessMap = loadTex(f.path+'roughness.'+f.ext,  false, rxx, ryy, f.mirror);
  floorMat.normalScale.set(f.ns, f.ns); floorMat.needsUpdate = true;
  const ft = document.getElementById('ftitle'); if (ft && f.label) ft.textContent = 'Floor.DSGN · ' + f.label;
  old.forEach(t => t && t.dispose());
}
setFloor('light');
const floor = new THREE.Mesh(new THREE.PlaneGeometry(fW, fD), floorMat);
floor.rotation.x = -Math.PI/2; floor.receiveShadow = true; scene.add(floor);

/* ───────────────── helpers ───────────────── */
function _uv2(geo){ const uv = geo.attributes.uv; if(uv && !geo.attributes.uv1) geo.setAttribute('uv1', uv); if(uv && !geo.attributes.uv2) geo.setAttribute('uv2', uv); return geo; }   // second UV set for aoMap (r158 channel 1 = uv1); harmless if no aoMap
const box = (w,h,d, mat, x,y,z, cast=true, recv=true) => {
  const m = new THREE.Mesh(_uv2(new THREE.BoxGeometry(w,h,d)), mat);
  m.position.set(x,y,z); m.castShadow=cast; m.receiveShadow=recv; scene.add(m); return m;
};
const rbox = (w,h,d, mat, x,y,z, r=0.02, cast=true, recv=true) => {
  const m = new THREE.Mesh(new RoundedBoxGeometry(w,h,d,4,r), mat);
  m.position.set(x,y,z); m.castShadow=cast; m.receiveShadow=recv; scene.add(m); return m;
};

/* ───────────────── shell: textured walls + ceiling ─────────────────
   Per-wall materials (Phase 4): the single wall material is split into 4 independent instances
   (left/right/back/window). Each starts EXACTLY like the original shared wallMat (concrete colour
   + micro normal/roughness at repeat 6×3, ns 0.22) → default showcase byte-identical (I1). The
   window wall's 4 pieces share the one 'window' material; the ceiling is excluded. */
function _wallTex(p){ return loadTex(p, false, 6, 3); }
function makeWallMat(wall){ const m = new THREE.MeshStandardMaterial({
  color: C.concrete, roughness: 0.97, metalness: 0.0,
  normalMap: _wallTex(WALLT + 'normal.png'), normalScale: new THREE.Vector2(0.22, 0.22),
  roughnessMap: _wallTex(WALLT + 'roughness.png') }); m.userData = { wall }; return m; }
const wallMatL = makeWallMat('left'), wallMatR = makeWallMat('right'), wallMatB = makeWallMat('back'), wallMatW = makeWallMat('window');
const WALL_MATS = { left:wallMatL, right:wallMatR, back:wallMatB, window:wallMatW };
const _wallState  = { left:'microcement', right:'microcement', back:'microcement', window:'microcement' };
const _wallColor  = { left:null, right:null, back:null, window:null };   // palette tint (null = material default)
const _wallDesign = { left:null, right:null, back:null, window:null };   // _designs diffuse src (null = base material)
/* WALLS = wall-appropriate finishes (microcement / concrete / rubber) with the SAME palette+design
   UX as the floor — NO terrazzo (floor-scale chips read wrong on a wall). microcement is the clean
   default (no diffuse, warm-concrete colour, micro normal at 6×3 → I1); concrete/rubber are MIRRORED
   photoscans at a physical wall scale (no seams). Each maps to its _designs variant set. */
const WALLS = {
  microcement: { path: WALLT,                                        tile: 1.6, ns: 0.22,              diffuse:false, design:'microtopping',        label:'Микроцемент' },
  concrete:    { path: '3d-assets/textures-v4/decorative-concrete/', tile: 1.3, ns: 0.55, rough: 0.90, ao: 0.7, diffuse:true, design:'decorative-concrete', label:'Бетон' },   // stronger relief so form-lines survive tinting; slight sheen; baked AO
  rubber:      { path: '3d-assets/textures-v4/rubber/',              tile: 1.5, ns: 0.55, rough: 0.78, ao: 0.6, diffuse:true, design:'rubber',              label:'Резина' },   // rubber sheen (lower roughness) so it reads ≠ concrete
};
function _wallKeys(wallKey){ return (wallKey === 'all') ? ['left','right','back','window'] : (WALL_MATS[wallKey] ? [wallKey] : []); }
function _wallRepeat(wk, tile){ const horiz = (wk==='left'||wk==='right') ? curD : curW; return [Math.max(1, horiz/tile), Math.max(1, curH/tile)]; }
function _wallBaseColor(wk){ return _wallColor[wk] != null ? _wallColor[wk] : ((WALLS[_wallState[wk]]||WALLS.microcement).diffuse ? 0xffffff : C.concrete); }
function setWall(wallKey, matKey){
  const w = WALLS[matKey] || WALLS.microcement;
  for(const wk of _wallKeys(wallKey)){ const m = WALL_MATS[wk]; if(!m) continue;
    const old = [m.map, m.normalMap, m.roughnessMap, m.aoMap];
    if(w.diffuse === false){                                  // microcement = clean wall, no diffuse (= the showcase default)
      m.map = null; m.aoMap = null;
      m.normalMap = _wallTex(WALLT + 'normal.png');           // micro normal at 6×3
      m.roughnessMap = _wallTex(WALLT + 'roughness.png');
    } else {                                                  // concrete / rubber = mirrored photoscan at physical wall scale
      const [rx, ry] = _wallRepeat(wk, w.tile);
      m.map = loadTex(w.path + 'diffuse.jpg', true, rx, ry, true);    // mirrored wrap = no seams
      m.normalMap = loadTex(w.path + 'normal.png', false, rx, ry, true);
      m.roughnessMap = loadTex(w.path + 'roughness.png', false, rx, ry, true);
      m.aoMap = loadTex(w.path + 'ao.png', false, rx, ry, true);      // baked AO (the shipped ao.png) → real surface/junction self-shadow
      m.aoMapIntensity = (w.ao != null) ? w.ao : 0.6;
    }
    _wallState[wk] = (matKey in WALLS) ? matKey : 'microcement';
    _wallDesign[wk] = null;                                   // material change clears the design variant
    m.color.setHex(_wallBaseColor(wk)); m.normalScale.set(w.ns, w.ns);
    m.roughness = (w.rough != null) ? w.rough : 0.97;        // per-material sheen; microcement keeps 0.97 (I1)
    m.needsUpdate = true;
    old.forEach(t => t && t.dispose());
  }
  requestBake();
}
function setWallColor(wallKey, hex){                          // palette tint (hex number/string, or null/'orig' = material default)
  for(const wk of _wallKeys(wallKey)){ const m = WALL_MATS[wk]; if(!m) continue;
    _wallColor[wk] = (hex == null || hex === 'orig') ? null : (typeof hex === 'string' ? parseInt(hex.replace('#',''),16) : hex);
    m.color.setHex(_wallBaseColor(wk)); m.needsUpdate = true; }
  requestBake();
}
function setWallDesign(wallKey, src){                         // swap ONLY the diffuse to a _designs image (mirror of the floor's applyDesign)
  for(const wk of _wallKeys(wallKey)){ const m = WALL_MATS[wk]; if(!m) continue;
    if(!src || src === 'orig'){ _wallDesign[wk] = null; setWall(wk, _wallState[wk]); continue; }
    _wallDesign[wk] = src;
    const [rx, ry] = _wallRepeat(wk, (WALLS[_wallState[wk]] || WALLS.microcement).tile);
    const img = new Image();
    img.onload = () => { const t = new THREE.Texture(img); t.colorSpace = THREE.SRGBColorSpace;
      t.wrapS = t.wrapT = THREE.MirroredRepeatWrapping; t.anisotropy = MAXA; t.repeat.set(rx, ry); t.needsUpdate = true;
      const oldm = m.map; m.map = t; m.color.setHex(_wallBaseColor(wk)); m.needsUpdate = true; oldm && oldm.dispose(); requestBake(); };
    img.src = src;
  }
}
function getWalls(){ const o = {}; for(const wk of ['left','right','back','window']) o[wk] = { mat:_wallState[wk], color:_wallColor[wk], design:_wallDesign[wk] }; return o; }
function getWallDesignKey(matKey){ return (WALLS[matKey] || WALLS.microcement).design; }
function wallSrc(wk){ const m=WALL_MATS[wk]; return m ? { mat:_wallState[wk], src:(m.map&&m.map.image&&m.map.image.src)||null, color:m.color.getHex(), design:_wallDesign[wk], repeat:(m.map?+m.map.repeat.x.toFixed(2):null) } : null; }   // QA reader
box(0.2, H, D, wallMatL, -hw, H/2, 0, false, true);
box(0.2, H, D, wallMatR,  hw, H/2, 0, false, true);
box(W, H, 0.2, wallMatB, 0, H/2, hd, false, true);
box(W, 0.2, D, new THREE.MeshStandardMaterial({ color: C.ceiling, roughness: 0.98 }), 0, H + 0.1, 0, false, true);

/* far wall around a big window band (y 0.95 → 2.55) — all 4 pieces share the 'window' material */
const winB = 0.95, winT = 2.55, jamb = 0.5;
box(W, winB, 0.2, wallMatW, 0, winB/2, -hd);
box(W, H-winT, 0.2, wallMatW, 0, winT + (H-winT)/2, -hd);
box(jamb, winT-winB, 0.2, wallMatW, -hw + jamb/2, (winB+winT)/2, -hd);
box(jamb, winT-winB, 0.2, wallMatW,  hw - jamb/2, (winB+winT)/2, -hd);

/* daylight = the soft HDRI backdrop showing THROUGH the window (set on HDRI load) —
   reads more real than a flat bright plane. Here we just build the window frame. */
const mullMat = new THREE.MeshStandardMaterial({ color: 0xb0aa9e, roughness: 0.85 });
/* cast=false: the thin frame is decorative only. If it casts, the sun projects a
   hard window-pane grid onto the floor that reads as tile seams — wrong message for
   a SEAMLESS poured terrazzo. Daylight still enters as one soft window-shaped wash. */
box(0.07, winT-winB, 0.07, mullMat, -W*0.17, (winB+winT)/2, -hd+0.02, false, false);
box(0.07, winT-winB, 0.07, mullMat,  W*0.17, (winB+winT)/2, -hd+0.02, false, false);
box(W-2*jamb, 0.07, 0.07, mullMat, 0, (winB+winT)/2, -hd+0.02, false, false);   // transom

/* ceiling light strips (emissive) → linear reflections */
const stripMat = new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0xfff2e2, emissiveIntensity: 1.5, roughness: 1, fog:false });
for (const sx of [-3.2, 0, 3.2]) box(0.14, 0.04, D*0.66, stripMat, sx, H-0.02, -0.3, false, false);

/* capture the default showcase shell (everything in the scene so far except the floor)
   so setRoomDims() can hide it when a custom room size is applied */
const defShell = scene.children.filter(o => o.isMesh && o !== floor);

/* ───────────────── styled living-room kit — frames the floor, never hides it ─────────────────
   Grouped under `roomKit` so a future room-type selector (bedroom/kitchen/bath…) can swap kits. */
const roomKit = new THREE.Group(); scene.add(roomKit);
const sr = (m,x,y,z)=>{ m.position.set(x,y,z); m.castShadow=m.receiveShadow=true; roomKit.add(m); return m; };

/* ───────────────── movable furniture (Phase 2) ─────────────────
   mov(name,kind,...objs): groups already-built roomKit pieces (+ their light) into one Group
   whose pivot is the footprint centre (XZ centroid, min-Y). roomKit is at the origin, so a
   child's local position equals its world position — re-parenting with a compensated local
   keeps every visual byte-identical (I1) while making the cluster pick/move/rotate as a unit. */
const MOVABLES = [];
const _movBox = new THREE.Box3();
function mov(name, kind, ...objs){
  objs = objs.filter(Boolean);
  if(!objs.length) return null;
  _movBox.makeEmpty();
  objs.forEach(o => { if(o.isLight) return; o.updateMatrixWorld(true); _movBox.expandByObject(o); });
  let cx=0, cy=0, cz=0;
  if(!_movBox.isEmpty()){ cx=(_movBox.min.x+_movBox.max.x)/2; cz=(_movBox.min.z+_movBox.max.z)/2; cy=_movBox.min.y; }
  const g = new THREE.Group();
  g.position.set(cx, cy, cz);
  g.userData = { movable:true, name, kind };
  roomKit.add(g);
  objs.forEach(o => { o.position.x-=cx; o.position.y-=cy; o.position.z-=cz; g.add(o); });   // .add re-parents
  g.updateMatrixWorld(true);
  g.userData.homeMatrix = g.matrix.clone();
  // home half-extents (XZ) for wall-clamping; recomputed live while dragging a rotated piece
  _movBox.makeEmpty(); objs.forEach(o=>{ if(!o.isLight) _movBox.expandByObject(o); });
  g.userData.halfX = _movBox.isEmpty()?0.3:(_movBox.max.x-_movBox.min.x)/2;
  g.userData.halfZ = _movBox.isEmpty()?0.3:(_movBox.max.z-_movBox.min.z)/2;
  MOVABLES.push(g);
  return g;
}

   setStyle(key) mutates the shared MAT.* in place (color/roughness/metalness), so every piece
   (current and rebuilt) re-skins live and the style survives clearKit + furniture moves. The ONE
   brand accent (MAT.signal) is always C.signal. `warm` reproduces the showcase exactly → I1. */
const STYLES = {
  warm:    { linen:{color:0xc7bca8,roughness:0.97}, linenD:{color:0xb3a78f,roughness:0.97}, oak:{color:0x7a5a3a,roughness:0.45}, walnut:{color:0x46321f,roughness:0.4}, metal:{color:0x191917,roughness:0.32,metalness:0.75}, paper:{color:0xe9e3d6,roughness:0.9}, stone:{color:0xb3a791,roughness:0.7} },

  minimal: { env:1.05, linen:{color:0xcfcdc4,roughness:0.96}, linenD:{color:0xb8b6ac,roughness:0.96}, oak:{color:0x8f8474,roughness:0.5}, walnut:{color:0x3a3a37,roughness:0.45}, metal:{color:0x1a1a18,roughness:0.35,metalness:0.7}, paper:{color:0xeeece4,roughness:0.92}, stone:{color:0xbdb9ad,roughness:0.72} },
  modern:  { env:1.20, linen:{color:0xd0c8b9,roughness:0.96}, linenD:{color:0xb6ad9b,roughness:0.96}, oak:{color:0x6f5238,roughness:0.42}, walnut:{color:0x3c2a1c,roughness:0.38}, metal:{color:0x2a2a28,roughness:0.28,metalness:0.85}, paper:{color:0xeae4d6,roughness:0.9}, stone:{color:0xb1a690,roughness:0.68} },
};
const _STYLE_KEYS = ['linen','linenD','oak','walnut','metal','paper','stone'];
let _style = 'warm';
let _envMul = 1.0;   // P5: per-style floor-reflection mood; warm/default stays exactly 1.0 (I1)
function setStyle(key){
  const s = STYLES[key] || STYLES.warm;
  for(const k of _STYLE_KEYS){ const m=MAT[k], d=s[k]; if(!m||!d) continue;
    m.color.setHex(d.color); m.roughness = d.roughness; m.metalness = (d.metalness!=null ? d.metalness : 0); m.needsUpdate = true; }
  MAT.signal.color.setHex(C.signal); MAT.signal.needsUpdate = true;   // lock the single accent (I5)
  _envMul = (s.env != null) ? s.env : 1.0;                            // P5: subtle floor-reflection mood per style
  _style = (key in STYLES) ? key : 'warm';
  requestBake();
  return _style;
}
function getStyle(){ return _style; }

function buildFicus(px,pz){
  const g=new THREE.Group(); const add=(m,x,y,z)=>{ m.position.set(x,y,z); m.castShadow=true; g.add(m); };
  add(new THREE.Mesh(new THREE.CylinderGeometry(0.21,0.24,0.42,28), new THREE.MeshStandardMaterial({color:0xada494,roughness:0.85})), 0,0.21,0);
  for(let i=0;i<5;i++){ const t=new THREE.Mesh(new THREE.CylinderGeometry(0.035,0.05,1.7,10), MAT.walnut); t.position.set((i-2)*0.04,1.1,0); t.rotation.z=(i-2)*0.05; t.castShadow=true; g.add(t); }
  const leaf=new THREE.MeshStandardMaterial({color:0x3c5a34,roughness:0.8,side:THREE.DoubleSide});
  for(let i=0;i<22;i++){ const a=i*2.4, r=0.35+((i*13)%5)*0.06, y=1.5+((i*7)%6)*0.12;
    const cl=new THREE.Mesh(new THREE.IcosahedronGeometry(0.18+((i*11)%4)*0.03,0), leaf);
    cl.position.set(Math.cos(a)*r,y,Math.sin(a)*r); cl.castShadow=true; g.add(cl); }
  g.position.set(px,0,pz); roomKit.add(g); return g;
}
function buildSnake(px,pz){
  const g=new THREE.Group();
  const pot=new THREE.Mesh(new THREE.CylinderGeometry(0.16,0.12,0.32,28), new THREE.MeshStandardMaterial({color:0x9a8a78,roughness:0.9}));
  pot.position.y=0.16; pot.castShadow=pot.receiveShadow=true; g.add(pot);
  const bD=new THREE.MeshStandardMaterial({color:0x33502f,roughness:0.72,side:THREE.DoubleSide});
  const bL=new THREE.MeshStandardMaterial({color:0x4a6b3a,roughness:0.72,side:THREE.DoubleSide});
  for(let i=0;i<9;i++){ const a=(i/9)*Math.PI*2, h=0.6+((i*37)%5)*0.09, ln=0.10+((i*53)%4)*0.05;
    const bl=new THREE.Mesh(new THREE.BoxGeometry(0.06,h,0.013),(i%3===0)?bL:bD);
    bl.position.set(Math.cos(a)*0.05,0.32+h/2*Math.cos(ln),Math.sin(a)*0.05);
    bl.rotation.set(Math.sin(a)*ln,-a,-Math.cos(a)*ln); bl.castShadow=true; g.add(bl); }
  g.position.set(px,0,pz); roomKit.add(g); return g;
}

function clampCamera(){
  // Damped clamp (lerp 0.5 toward the clamped position) instead of a hard snap —
  // kills the "stuck in the wall" jitter while still keeping the camera inside the room.
  const cx = Math.min(ROOM_BOUND.x, Math.max(-ROOM_BOUND.x, camera.position.x));
  const cz = Math.min(ROOM_BOUND.z, Math.max(-ROOM_BOUND.z, camera.position.z));
  const cy = Math.min(ROOM_BOUND.yMax, Math.max(ROOM_BOUND.yMin, camera.position.y));
  camera.position.x += (cx - camera.position.x) * 0.5;

  const A = TOUR[tour.i], B = TOUR[(tour.i+1)%TOUR.length];

const GradeShader = {
  uniforms: { tDiffuse:{value:null}, uTime:{value:0}, uVignette:{value:1.0}, uGrain:{value:0.022}, uCA:{value:0.0} },
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
  fragmentShader: `
    uniform sampler2D tDiffuse; uniform float uTime,uVignette,uGrain,uCA; varying vec2 vUv;
    float rand(vec2 c){ return fract(sin(dot(c, vec2(12.9898,78.233)))*43758.5453); }
    void main(){
      vec2 uv=vUv, d=uv-0.5; float r=length(d);
      vec2 off = d * uCA * r * 2.0;
      vec3 col = vec3(texture2D(tDiffuse, uv+off).r, texture2D(tDiffuse, uv).g, texture2D(tDiffuse, uv-off).b);
      float vig = 1.0 - smoothstep(0.28, 0.92, r*uVignette);
      col *= mix(0.58, 1.0, vig);
      col += (rand(uv*(uTime*0.6+1.0))-0.5) * uGrain;
      gl_FragColor = vec4(col, 1.0);
    }`
};

function reveal(){ document.getElementById('boot').classList.add('gone'); }
const HDRI_DIR = '3d-assets/textures-v4/_hdri/';
const LIGHTING = {

  noon:    { hdr:'studio_small_08.hdr',     exp:1.02, blur:0.30, sun:[0xfff4e6,2.4] },  // neutral noon
  evening: { hdr:'brown_photostudio_02.hdr',exp:0.86, blur:0.44, sun:[0xffb474,2.3] },  // warm evening

const _rgbe = new RGBELoader(); let _envHdr = null;
/* a small room concentrates the sun + ceiling strips into a hard bright beam — when a custom
   size is active we diffuse it: lower key sun, slightly lower exposure, softer penumbra, a touch
   more sky blur. Default showcase = factors 1 → byte-identical to the tuned golden hour. */
let _customRoom = false, _curCfg = LIGHTING.golden;
function _refreshLightLevels(){
  const cfg = _curCfg;
  renderer.toneMappingExposure = cfg.exp * (_customRoom ? 0.88 : 1);
  sun.intensity = cfg.sun[1] * (_customRoom ? 0.5 : 1);
  scene.backgroundBlurriness = Math.min(0.7, cfg.blur + (_customRoom ? 0.12 : 0));
  sun.shadow.radius = _customRoom ? 10 : 4;

}
function _applyLighting(hdr, cfg){

  scene.environment = pmrem.fromEquirectangular(hdr).texture;
  scene.background = hdr;

  bakeFloorReflection();
}
function setLighting(key){
  const cfg = LIGHTING[key] || LIGHTING.golden;
  _rgbe.load(HDRI_DIR + cfg.hdr, (hdr) => _applyLighting(hdr, cfg),
    undefined, () => { renderer.toneMappingExposure = cfg.exp; bakeFloorReflection(); });
}

/* decorative divider strips (latunь "маяки"/саргели) — a control-joint grid sized
   to the room, cells <= 3 m so the poured floor doesn't crack and reads premium.
   On for terrazzo/epoxy/concrete; OFF for seamless microcement & comfort (PU). */
let _dividers = null, _dividersOn = false;
function buildDividers(){
  const g = new THREE.Group();
  // brass strips ground FLUSH with the terrazzo (one level) and sealed under the same glossy
  // topcoat — barely proud of the floor (no raised "layer"), clearcoat matching the floor.
  const mat = new THREE.MeshPhysicalMaterial({ color:0xb08d57, metalness:0.85, roughness:0.35, clearcoat:1.0, clearcoatRoughness:0.10, envMapIntensity:1.0 });
  const w = 0.012, h = 0.0015, y = 0.001;   // ~1.5 mm proud → reads as a flush inlay, not a raised bar
  const nx = Math.ceil(curW/3), nz = Math.ceil(curD/3);            // cells <= 3 m, proportional to live room
  for (let i=1;i<nx;i++){ const x = -curW/2 + i*(curW/nx); const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,curD), mat); m.position.set(x,y,0); m.receiveShadow=true; g.add(m); }
  for (let j=1;j<nz;j++){ const z = -curD/2 + j*(curD/nz); const m = new THREE.Mesh(new THREE.BoxGeometry(curW,h,w), mat); m.position.set(0,y,z); m.receiveShadow=true; g.add(m); }
  scene.add(g); return g;
}
function setDividers(on){
  _dividersOn = !!on;

  if (_dividers) _dividers.visible = !!on;

/* ── parametric room size (additive — the default 12×8×3.2 path is untouched) ──
   Moves walls/ceiling/window/joints/clamp/shadow to the user's dimensions and hides the
   showcase shell + furniture. The floor PLANE and its texture are left intact so chip
   scale and tiling stay correct; dims are clamped to keep the floor covering the room. */
let _customShell = null;
function _disposeGroup(g){ g.traverse(o => { o.geometry && o.geometry.dispose(); }); }
function buildCustomShell(w, d, h){
  const g = new THREE.Group();
  const hw2 = w/2, hd2 = d/2;
  const cb = (W_,H_,D_,mat,x,y,z) => { const m = new THREE.Mesh(_uv2(new THREE.BoxGeometry(W_,H_,D_)), mat); m.position.set(x,y,z); m.receiveShadow = true; g.add(m); return m; };
  cb(0.2, h, d, wallMatL, -hw2, h/2, 0);                                // shares the 4 per-wall materials → custom rooms inherit setWall finishes
  cb(0.2, h, d, wallMatR,  hw2, h/2, 0);
  cb(w, h, 0.2, wallMatB, 0, h/2, hd2);                                 // wall behind the camera
  cb(w, 0.2, d, new THREE.MeshStandardMaterial({ color:C.ceiling, roughness:0.98 }), 0, h+0.1, 0);
  const wB = Math.min(0.95, h*0.30), wT = Math.min(h-0.3, 2.55), jb = Math.min(0.5, w*0.12);
  cb(w, wB, 0.2, wallMatW, 0, wB/2, -hd2);                              // far wall around a window band
  cb(w, h-wT, 0.2, wallMatW, 0, wT+(h-wT)/2, -hd2);
  cb(jb, wT-wB, 0.2, wallMatW, -hw2+jb/2, (wB+wT)/2, -hd2);
  cb(jb, wT-wB, 0.2, wallMatW,  hw2-jb/2, (wB+wT)/2, -hd2);
  const sm = new THREE.MeshStandardMaterial({ color:0xffffff, emissive:0xfff2e2, emissiveIntensity:0.5, roughness:1, fog:false });  // dim → no hard beam on the glossy floor
  for (const sx of [-w*0.27, 0, w*0.27]){ const m = new THREE.Mesh(new THREE.BoxGeometry(0.14,0.04,d*0.66), sm); m.position.set(sx, h-0.02, -0.3); g.add(m); }
  scene.add(g); return g;
}
function applyRoomShell(w, d, h, furnished){
  w = Math.max(3, Math.min(13, +w||W)); d = Math.max(2.5, Math.min(9, +d||D)); h = Math.max(2.2, Math.min(4, +h||H));
  curW = w; curD = d; curH = h;
  const isDef = (w===W && d===D && h===H);
  defShell.forEach(m => m.visible = isDef);                             // detailed showcase shell only at full size
  roomKit.visible = !!furnished;                                       // room-type kits stay; manual dims = empty
  if (_customShell){ scene.remove(_customShell); _disposeGroup(_customShell); _customShell = null; }
  if (!isDef) _customShell = buildCustomShell(w, d, h);
  if (_dividers){ scene.remove(_dividers); _disposeGroup(_dividers); _dividers = null; }   // rebuild grid for the new footprint
  if (_dividersOn){ _dividers = buildDividers(); _dividers.visible = true; }
  ROOM_BOUND.x = Math.max(0.6, w/2-0.45); ROOM_BOUND.z = Math.max(0.6, d/2-0.45); ROOM_BOUND.yMax = h-0.3;
  controls.maxDistance = isDef ? 9.0 : Math.max(3.0, Math.min(9.0, 0.55*Math.hypot(w, d)));   // per-room zoom radius; default keeps exactly 9.0
  const sc = isDef ? 9 : (Math.max(w, d)/2 + 1.5); sun.shadow.camera.left=-sc; sun.shadow.camera.right=sc; sun.shadow.camera.top=sc; sun.shadow.camera.bottom=-sc; sun.shadow.camera.updateProjectionMatrix();
  _customRoom = !isDef; _refreshLightLevels();   // diffuse the light for the smaller room (full showcase untouched)
  bakeFloorReflection();
}
function setRoomDims(w, d, h){   // manual "Размер комнаты" → empty room at exact size + scale figure
  applyRoomShell(w, d, h, false);
  scaleFigure(true); if (_figure) _figure.position.set(Math.min(1.9, curW/2-0.6), 0, Math.min(0.7, curD/2-0.6));
}
/* live time-of-day — arcs the sun (shadow direction) + shifts warmth; no re-bake (sun is a
   live light, not in the baked env map). Brightness/HDRI stay with the preset/soften system. */
let _sunTime = 0.4;
const _sunM = new THREE.Color(0xffc081), _sunN = new THREE.Color(0xfff2df), _sunE = new THREE.Color(0xff9846);
function setSunTime(t){
  _sunTime = Math.max(0, Math.min(1, +t));
  const u = _sunTime;
  sun.position.set(-6 + 12*u, 3.2 + 5.8*Math.sin(Math.PI*u), -10);
  sun.color.copy(u < 0.5 ? _sunM.clone().lerp(_sunN, u*2) : _sunN.clone().lerp(_sunE, (u-0.5)*2));
}
/* ───────────────── edit mode: pick · drag · rotate movable furniture (Phase 2) ─────────────────
   Custom raycaster + Pointer Events (no gizmo). OFF == today's behaviour (orbit + autoRotate);
   nothing here runs unless setEditMode(true) is called, so the default boot is untouched (I1). */
let _editMode=false, _selected=null, _grab=null, _boxHelper=null, _editCb=null, _prevAuto=null;
const _ray=new THREE.Raycaster(), _ndc=new THREE.Vector2();
const _dragPlane=new THREE.Plane(new THREE.Vector3(0,1,0), 0);   // y=0 floor
const _hitPt=new THREE.Vector3(), _grabOff=new THREE.Vector3(), _tmpV=new THREE.Vector3();
const ROT_STEP=Math.PI/12;                                       // ±15°

// engine-owned floating toolbar (hidden until a piece is selected → no effect on default boot)
const _editBar=document.createElement('div');
_editBar.id='roomEditBar'; _editBar.style.display='none';
_editBar.innerHTML='<button type="button" data-a="rl" aria-label="Повернуть на −15°">◁</button>'
  +'<button type="button" data-a="rr" aria-label="Повернуть на +15°">▷</button>'
  +'<button type="button" data-a="reset" aria-label="Сбросить элемент">Сброс</button>'
  +'<button type="button" data-a="close" aria-label="Снять выделение">×</button>';
document.body.appendChild(_editBar);

function _homePos(g){ return _tmpV.setFromMatrixPosition(g.userData.homeMatrix); }
function _liveHalf(g){ _movBox.setFromObject(g); return { x:(_movBox.max.x-_movBox.min.x)/2, z:(_movBox.max.z-_movBox.min.z)/2 }; }
function _clampXZ(g,x,z){ const h=_liveHalf(g); const lx=Math.max(0.05,curW/2-h.x), lz=Math.max(0.05,curD/2-h.z);
  return { x:Math.min(lx,Math.max(-lx,x)), z:Math.min(lz,Math.max(-lz,z)) }; }
function _ndcFrom(ev){ const r=renderer.domElement.getBoundingClientRect();
  _ndc.x=((ev.clientX-r.left)/r.width)*2-1; _ndc.y=-((ev.clientY-r.top)/r.height)*2+1; }
function _pick(ev){ _ndcFrom(ev); _ray.setFromCamera(_ndc,camera);
  const hits=_ray.intersectObjects(MOVABLES,true); if(!hits.length) return null;
  let o=hits[0].object; while(o && !(o.userData&&o.userData.movable)) o=o.parent; return o||null; }
function _positionBar(){ if(!_selected) return; _selected.updateMatrixWorld(true);
  _tmpV.setFromMatrixPosition(_selected.matrixWorld); _tmpV.y+=0.1; _tmpV.project(camera);
  const r=renderer.domElement.getBoundingClientRect();
  _editBar.style.left=(r.left+(_tmpV.x*0.5+0.5)*r.width)+'px';
  _editBar.style.top =(r.top +(-_tmpV.y*0.5+0.5)*r.height-46)+'px'; }
function _select(g){ _deselect(); _selected=g;
  _boxHelper=new THREE.BoxHelper(g, new THREE.Color(C.signal)); _boxHelper.material.depthTest=false; _boxHelper.material.transparent=true; scene.add(_boxHelper);
  _editBar.style.display='flex'; _positionBar(); }
function _deselect(){ if(_boxHelper){ scene.remove(_boxHelper); _boxHelper.geometry.dispose(); _boxHelper=null; } _selected=null; if(_editBar) _editBar.style.display='none'; }
function _fireEdit(){ if(_editCb){ try{ _editCb(getMovables()); }catch(e){} } }

function _down(ev){ if(!_editMode) return; const g=_pick(ev); if(!g){ _deselect(); return; }
  _select(g);
  _ndcFrom(ev); _ray.setFromCamera(_ndc,camera);
  if(_ray.ray.intersectPlane(_dragPlane,_hitPt)) _grabOff.set(g.position.x-_hitPt.x,0,g.position.z-_hitPt.z); else _grabOff.set(0,0,0);
  _grab=g; controls.enabled=false;
  try{ renderer.domElement.setPointerCapture(ev.pointerId); }catch(e){} }
function _moveDrag(ev){ if(!_editMode||!_grab) return;
  _ndcFrom(ev); _ray.setFromCamera(_ndc,camera);
  if(!_ray.ray.intersectPlane(_dragPlane,_hitPt)) return;
  const c=_clampXZ(_grab,_hitPt.x+_grabOff.x,_hitPt.z+_grabOff.z);
  _grab.position.x=c.x; _grab.position.z=c.z;                       // move only (no bake mid-drag, I4)
  if(_boxHelper) _boxHelper.update(); _positionBar(); }
function _up(ev){ if(!_grab) return; _grab=null; controls.enabled=true; requestBake(); _fireEdit(); }   // bake once on settle

renderer.domElement.addEventListener('pointerdown',_down);
window.addEventListener('pointermove',_moveDrag);
window.addEventListener('pointerup',_up);
window.addEventListener('pointercancel',_up);
_editBar.addEventListener('click',(ev)=>{ const b=ev.target.closest('button'); if(!b||!_selected) return; const a=b.dataset.a;
  if(a==='close'){ _deselect(); return; }
  if(a==='rl') _selected.rotation.y+=ROT_STEP;
  else if(a==='rr') _selected.rotation.y-=ROT_STEP;
  else if(a==='reset'){ _selected.userData.homeMatrix.decompose(_selected.position,_selected.quaternion,_selected.scale); }
  // keep a rotated piece inside the walls
  const c=_clampXZ(_selected,_selected.position.x,_selected.position.z); _selected.position.x=c.x; _selected.position.z=c.z;
  _selected.updateMatrixWorld(true); if(_boxHelper)_boxHelper.update(); _positionBar(); requestBake(); _fireEdit(); });

function setEditMode(on){ on=!!on;
  if(on && !_editMode){ _prevAuto=controls.autoRotate; controls.autoRotate=false; stopTour(); tween=null; }   // M5: freeze any tour/tween so the camera can't fly while dragging a piece
  else if(!on && _editMode){ if(_prevAuto!=null) controls.autoRotate=_prevAuto; _deselect(); controls.enabled=true; }
  _editMode=on; document.body.classList.toggle('room-editing',on); return _editMode; }
function getMovables(){ return MOVABLES.map(g=>{ const hp=_homePos(g);
  const moved=Math.abs(g.position.x-hp.x)>1e-3||Math.abs(g.position.z-hp.z)>1e-3||Math.abs(g.rotation.y)>1e-3;
  return { name:g.userData.name, kind:g.userData.kind, x:+g.position.x.toFixed(3), z:+g.position.z.toFixed(3), ry:+g.rotation.y.toFixed(4), moved }; }); }
function setTransforms(arr){ if(!Array.isArray(arr)) return;
  arr.forEach(t=>{ if(!t||!t.name) return; const g=MOVABLES.find(m=>m.userData.name===t.name); if(!g) return;
    if(Number.isFinite(t.ry)) g.rotation.y=t.ry;                                        // M6: Number.isFinite — typeof NaN==='number' would NaN-poison the transform
    const c=_clampXZ(g, Number.isFinite(t.x)?t.x:g.position.x, Number.isFinite(t.z)?t.z:g.position.z);
    g.position.x=c.x; g.position.z=c.z; g.updateMatrixWorld(true); });
  if(_boxHelper&&_selected) _boxHelper.update(); requestBake(); }
function resetTransforms(){ MOVABLES.forEach(g=>{ g.userData.homeMatrix.decompose(g.position,g.quaternion,g.scale); g.updateMatrixWorld(true); });
  if(_boxHelper&&_selected) _boxHelper.update(); requestBake(); _fireEdit(); }
function onEdit(cb){ _editCb=cb; }
/* QA/util helpers */
function screenOf(name){ const g=MOVABLES.find(m=>m.userData.name===name); if(!g) return null;
  g.updateMatrixWorld(true); _tmpV.setFromMatrixPosition(g.matrixWorld); _tmpV.y+=0.4; _tmpV.project(camera);
  const r=renderer.domElement.getBoundingClientRect();
  return { x:r.left+(_tmpV.x*0.5+0.5)*r.width, y:r.top+(-_tmpV.y*0.5+0.5)*r.height }; }
function lampInfo(name){ const g=MOVABLES.find(m=>m.userData.name===name); if(!g) return null;
  let light=null; g.traverse(o=>{ if(o.isLight) light=o; }); if(!light) return { hasLight:false };
  light.updateMatrixWorld(true); _tmpV.setFromMatrixPosition(light.matrixWorld);
  return { hasLight:true, lx:+_tmpV.x.toFixed(3), lz:+_tmpV.z.toFixed(3) }; }

window.__room = { scene, camera, renderer, floorMat, controls, bake: bakeFloorReflection, goView,
                  setLighting, scaleFigure, setDividers, setRoomDims, getDims: ()=>({ w:curW, d:curD, h:curH }),
                  setSunTime, getSunTime: ()=>_sunTime, DIM_DEFAULT: { w:W, d:D, h:H }, composer, sun, grade: ()=>gradePass && gradePass.uniforms,
                  clampCamera, getBound: ()=>({ x:ROOM_BOUND.x, z:ROOM_BOUND.z, yMin:ROOM_BOUND.yMin, yMax:ROOM_BOUND.yMax }),
                  setEditMode, getMovables, setTransforms, resetTransforms, onEdit, getEditMode:()=>_editMode,
                  setStyle, getStyle, matHex, setWall, setWallColor, setWallDesign, getWalls, getWallDesignKey, wallSrc, screenOf, lampInfo, getBakes:()=>_bakes };

(function loop(){
  if (tour){
    advanceTour(); camera.lookAt(controls.target);
  } else {
    if (tween){
      tween.t0++; const k = tween.t0/tween.dur, e = k<1 ? (1-Math.pow(1-k,3)) : 1;
      camera.position.lerpVectors(tween.p0, tween.p1, e);
      controls.target.lerpVectors(tween.g0, tween.g1, e);
      if (k>=1) tween = null;
    }
    controls.update();
    if (!tween) clampCamera();   // H1: clamp only settled user orbit — never fight an authored tween/tour path (was the camera "revert" on presets/custom rooms)
  }
  if (_bakeDirty){ _bakeDirty = false; bakeFloorReflection(); }   // H2: bake consumed from the loop → never lost to a dropped rAF (no permanent reflection-freeze)
  if (gradePass) gradePass.uniforms.uTime.value = performance.now()*0.001;
  if (useComposer && composer) composer.render(); else renderer.render(scene, camera);
  requestAnimationFrame(loop);
})();
</script>
